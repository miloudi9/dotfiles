# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# mouse scroll
set -g mouse on

# Use Vi key bindings on the tmux command line.
setw -g mode-keys vi

# Use Vi key bindings in copy mode for clipboard
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "kitty +kitten clipboard"

# ---- look (tokyo night) ----
set -g status-style "bg=#16161e,fg=#a9b1d6"
set -g status-left "#[fg=#16161e,bg=#7aa2f7,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#565f89]%H:%M  %d %b "
setw -g window-status-format "#[fg=#565f89] #I #W "
setw -g window-status-current-format "#[fg=#c0caf5,bg=#292e42,bold] #I #W "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#283457,fg=#c0caf5"
