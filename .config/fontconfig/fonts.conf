<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Single source of truth for system fonts. Apps should only ask for sans-serif / serif / monospace. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <!-- fallback for Nerd Font icon glyphs (Waybar, terminal prompts) -->
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Arabic</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Nerd Font icons draw larger than text glyphs; scale them to sit with Noto text -->
  <match target="font">
    <test name="family"><string>Symbols Nerd Font Mono</string></test>
    <edit name="matrix" mode="assign">
      <times><name>matrix</name><matrix><double>0.82</double><double>0</double><double>0</double><double>0.82</double></matrix></times>
    </edit>
  </match>
</fontconfig>
